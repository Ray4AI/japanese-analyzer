name: Build Tauri Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Tauri Windows (NSIS + portable)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectName: japanese-analyzer
          projectPath: .
          # NSIS 安装器 + 便携版 exe
          args: --target x86_64-pc-windows-msvc --bundles nsis
          includeUpdaterJson: false

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: japanese-analyzer-windows-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: japanese-analyzer-windows-portable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/japanese-analyzer.exe
          if-no-files-found: error

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/japanese-analyzer.exe
          generate_release_notes: true
